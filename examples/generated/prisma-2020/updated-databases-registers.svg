<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1460 1063" width="1460" height="1063" role="img" aria-labelledby="standardflow-title standardflow-description">
  <title id="standardflow-title">PRISMA 2020 flow diagram: updated review</title>
  <desc id="standardflow-description">Updated study identification and selection for fixture-updated-db-registers, using databases and registers only.</desc>
  <metadata id="standardflow-text-equivalent">PRISMA 2020 flow diagram: updated review

Updated study identification and selection for fixture-updated-db-registers, using databases and registers only.

1. Records identified from:
Databases (n = 120)
Registers (n = 30)
Total (n = 150)
2. Records removed before screening:
Duplicate records (n = 20)
Marked ineligible by automation (n = 5)
Other reasons (n = 5)
Total removed (n = 30)
3. Records screened
(n = 120)
4. Records excluded
(n = 70)
5. Reports sought for retrieval
(n = 50)
6. Reports not retrieved
(n = 5)
7. Reports assessed for eligibility
(n = 45)
8. Reports excluded (n = 25):
Wrong population (n = 10)
Wrong intervention (n = 8)
Wrong study design (n = 7)
9. Studies included in previous version
(n = 40)
Reports of previous studies
(n = 50)
10. New studies included in review
(n = 16)
Reports of new included studies
(n = 20)
11. Total studies included in review
(n = 56)
Reports of total included studies
(n = 70)
</metadata>
  <defs>
    <marker id="standardflow-arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" /></marker>
  </defs>
  <style>
    .standardflow-node rect { fill: white; stroke: currentColor; stroke-width: 2; }
    .standardflow-node--exclusion rect { stroke-dasharray: 7 4; }
    .standardflow-node--outcome rect { stroke-width: 3; }
    .standardflow-label { fill: currentColor; font-family: system-ui, sans-serif; font-size: 14px; }
    .standardflow-edge { fill: none; stroke: currentColor; stroke-width: 2; marker-end: url(#standardflow-arrow); }
    .standardflow-edge--exclusion { stroke-dasharray: 7 4; }
    .standardflow-edge-label { fill: currentColor; font-family: system-ui, sans-serif; font-size: 12px; }
  </style>
