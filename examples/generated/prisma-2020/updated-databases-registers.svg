    <path id="edge-db-identification-to-screening" class="standardflow-edge standardflow-edge--progression" d="M 910 196 L 910 251" />
    <path id="edge-db-screening-to-record-exclusion" class="standardflow-edge standardflow-edge--exclusion" d="M 1060 297 L 1120 297" />
    <path id="edge-db-screening-to-retrieval" class="standardflow-edge standardflow-edge--progression" d="M 910 343 L 910 398" />
