    .standardflow-edge { fill: none; stroke: currentColor; stroke-width: 2; marker-end: url(#standardflow-arrow); }
    .standardflow-edge--exclusion { stroke-dasharray: 7 4; }
    .standardflow-edge-label { fill: currentColor; font-family: system-ui, sans-serif; font-size: 12px; }
