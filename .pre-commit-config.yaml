repos:
- repo: https://github.com/gitleaks/gitleaks
  rev: v8.30.1
  hooks:
  - id: gitleaks
- repo: https://github.com/jumanjihouse/pre-commit-hooks
  rev: 3.0.0
  hooks:
  - id: shellcheck
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  - id: check-merge-conflict
  - id: check-json
    files: ^(schemas/|contracts/|recipes/|\.github/|renovate\.json$|package\.json$|api/package\.json$)
  - id: check-toml
    files: ^(Cargo\.toml$|crates/|rust-toolchain\.toml$)
  - id: check-yaml
    files: ^(\.github/|\.pre-commit-config\.yaml$)
  - id: end-of-file-fixer
    exclude: ^(source|archive|assets|docs|docx|pdf|html|latex|typst)/
  - id: trailing-whitespace
    args: [--markdown-linebreak-ext=md]
    exclude: ^(source|archive|assets|docs|docx|pdf|html|latex|typst)/
- repo: https://github.com/pre-commit/mirrors-eslint
  rev: v10.8.0
  hooks:
  - id: eslint
    files: ^(api/|scripts/|tests/).+\.(js|cjs|mjs)$
    args: [--max-warnings=0]
