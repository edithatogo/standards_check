# Maintained Python tooling. Historical imports and source evidence are not code
# owned by this formatter; tests retain their separate coverage workstream.
target-version = "py312"
line-length = 100
include = ["scripts/**/*.py"]
force-exclude = true

[lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[format]
quote-style = "double"
