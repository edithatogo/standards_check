name: Offline AI security
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: offline-ai-security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  offline-ai-security:
    uses: edithatogo/repository-standards/.github/workflows/reusable-ai-sec-pipeline.yml@36362fa872e4ce747266a6e795fcefa3dd343f67
    permissions:
      contents: read
    with:
      enforce_ai: false
