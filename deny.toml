# Runtime licences are reviewed per workspace; update with evidence, not broad waivers.
[advisories]
ignore = []

[licenses]
confidence-threshold = 0.8
allow = ["MIT", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "BSL-1.0", "CC0-1.0", "CDLA-Permissive-2.0", "Unlicense"]

# libFuzzer is a test-only dependency; its bundled LLVM code carries NCSA.
# Scope permission to the reviewed exact crate version, not the production graph.
[[licenses.exceptions]]
crate = "libfuzzer-sys@=0.4.13"
allow = ["NCSA"]

[bans]
multiple-versions = "warn"
wildcards = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = []
