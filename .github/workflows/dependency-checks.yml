name: Dependency checks

on:
  pull_request:
    paths:
      - 'api/**'
      - '.github/workflows/dependency-checks.yml'
  push:
    branches: [main]
    paths:
      - 'api/**'
      - '.github/workflows/dependency-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  api-dependency-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: api
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Install the locked dependency graph
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Exercise dependency security and compatibility regressions
        run: npm test
