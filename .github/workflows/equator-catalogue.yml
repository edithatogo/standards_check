name: EQUATOR directory (read-only source evidence)

on:
  pull_request:
    paths:
      - "scripts/sync_equator_catalog.py"
      - "scripts/reconcile_equator_sources.py"
      - "scripts/equator_source_links.py"
      - "scripts/survey_equator_articles.py"
      - "scripts/source_provider_evidence.py"
      - "tests/test_source_provider_evidence.py"
      - "scripts/reconcile_authoritative_articles.py"
      - "scripts/jats_checklist_structure.py"
      - "tests/test_survey_equator_articles.py"
      - "source/official/priority-article-candidates.json"
      - "tests/test_equator_source_links.py"
      - "tests/test_reconcile_equator_sources.py"
      - "source/index.yml"
      - "source/archetypes/**"
      - "source/variants/**"
      - "markdown/**"
      - "source/equator/**"
      - "tests/test_sync_equator_catalog.py"
      - ".github/workflows/equator-catalogue.yml"
  workflow_dispatch:
  schedule:
    - cron: "27 2 1 * *"

permissions:
  contents: read

concurrency:
  group: equator-catalogue-${{ github.ref }}
  cancel-in-progress: true

jobs:
  catalogue:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install the maintained PyYAML pin
        run: |
          python -m pip install --disable-pip-version-check \
            "$(grep -E '^PyYAML==[0-9.]+$' requirements/python-tests.txt)"
      - name: Read official upstream Git source (no provider writes)
        run: |
          git clone --filter=blob:none --depth=1 --sparse \
            https://github.com/EQUATOR-Network/equator-website.git "$RUNNER_TEMP/equator-website"
          git -C "$RUNNER_TEMP/equator-website" sparse-checkout set --no-cone \
            'reporting-guidelines/*/index.qmd'
      - name: Produce version-pinned metadata catalogue
        run: |
          python scripts/sync_equator_catalog.py --source "$RUNNER_TEMP/equator-website" \
            --mode discover --output "$RUNNER_TEMP/equator-discovery.json"
          python scripts/sync_equator_catalog.py --source "$RUNNER_TEMP/equator-website" \
            --mode catalogue --output "$RUNNER_TEMP/equator-catalogue.json"
      - name: Reconcile existing legacy checklists against source metadata
        run: |
          python -m unittest tests.test_reconcile_equator_sources -v
          python scripts/reconcile_equator_sources.py \
            --catalogue "$RUNNER_TEMP/equator-catalogue.json" \
            --output "$RUNNER_TEMP/equator-legacy-alignment.json"
      - name: Index possible original-source URLs without fetching copyrighted files
        run: |
          python -m unittest tests.test_equator_source_links -v
          python scripts/equator_source_links.py \
            --source "$RUNNER_TEMP/equator-website" \
            --catalogue "$RUNNER_TEMP/equator-catalogue.json" \
            --output "$RUNNER_TEMP/equator-source-link-candidates.json"
      - name: Resolve all catalogue identifiers and acquire selected primary OA candidates
        env:
          SOURCE_API_EMAIL: ${{ vars.SOURCE_API_EMAIL }}
        run: |
          python -m unittest tests.test_survey_equator_articles tests.test_source_provider_evidence -v
          python -m scripts.survey_equator_articles \
            --catalogue "$RUNNER_TEMP/equator-catalogue.json" \
            --output "$RUNNER_TEMP/equator-article-survey.json"
      - name: Report new, removed and changed published entries
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          before = json.loads(Path("source/equator/discovery.json").read_text())
          after = json.loads((Path(os.environ["RUNNER_TEMP"]) / "equator-discovery.json").read_text())
          old = {x["id"]: x["source_blob_sha"] for x in before["guidelines"]}
          new = {x["id"]: x["source_blob_sha"] for x in after["guidelines"]}
          counts = {
              "added": len(new.keys() - old.keys()),
              "removed": len(old.keys() - new.keys()),
              "revised": sum(old[x] != new[x] for x in old.keys() & new.keys()),
          }
          print(f"source: {after['source_revision']} / {after['published_count']} published")
          print(f"directory changes vs checked-in pin: {counts}")
          metadata = json.loads((Path(os.environ["RUNNER_TEMP"]) / "equator-catalogue.json").read_text())
          print(f"unresolved upstream metadata: {metadata['metadata_issue_count']}")
          PY
      - name: Retain source catalogue for review (not auto-admitted)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: equator-source-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/equator-discovery.json
            ${{ runner.temp }}/equator-catalogue.json
            ${{ runner.temp }}/equator-legacy-alignment.json
            ${{ runner.temp }}/equator-source-link-candidates.json
            ${{ runner.temp }}/equator-article-survey.json
          if-no-files-found: warn
