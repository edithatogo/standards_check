name: Python regression tests

on:
  pull_request:
    paths:
      - "scripts/**"
      - "tests/**"
      - "utils/**"
      - "*.py"
      - "requirements/python-tests.txt"
      - ".github/workflows/python-tests.yml"
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "tests/**"
      - "utils/**"
      - "*.py"
      - "requirements/python-tests.txt"
      - ".github/workflows/python-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/python-tests.txt
      - name: Install Graphviz for Petri-net rendering
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends graphviz
      - name: Install regression dependencies
        run: python -m pip install --disable-pip-version-check --requirement requirements/python-tests.txt
      - name: Run offline Python regressions
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: python -m pytest --import-mode=importlib tests test_extract_and_convert.py
