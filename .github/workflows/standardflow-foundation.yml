name: StandardFlow foundation

on:
  pull_request:
    paths:
      - "Cargo.*"
      - "rust-toolchain.toml"
      - "requirements/standardflow-foundation.txt"
      - "crates/**"
      - "schemas/**"
      - "contracts/**"
      - "conductor/**"
      - "docs/architecture/**"
      - "scripts/validate_foundation.py"
      - "scripts/audit_foundation.py"
      - "tests/test_foundation_audit.py"
      - ".gitmodules"
      - ".agents/plugins/conductor"
      - ".agents/skills/conductor/**"
      - ".github/workflows/standardflow-foundation.yml"
  push:
    branches: [main]
    paths:
      - "Cargo.*"
      - "rust-toolchain.toml"
      - "requirements/standardflow-foundation.txt"
      - "crates/**"
      - "schemas/**"
      - "contracts/**"
      - "conductor/**"
      - "docs/architecture/**"
      - "scripts/validate_foundation.py"
      - "scripts/audit_foundation.py"
      - "tests/test_foundation_audit.py"
      - ".gitmodules"
      - ".agents/plugins/conductor"
      - ".agents/skills/conductor/**"
      - ".github/workflows/standardflow-foundation.yml"

permissions:
  contents: read

concurrency:
  group: standardflow-foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements/standardflow-foundation.txt
      - run: python -m pip install --disable-pip-version-check --no-deps --requirement requirements/standardflow-foundation.txt
      - run: python scripts/validate_foundation.py
      - run: python -m unittest tests.test_foundation_audit
      - run: python scripts/audit_foundation.py

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.98.1
          components: rustfmt,clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --all-targets --all-features --locked
