name: Dependency inventories

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sbom-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  inventory:
    name: Maintained dependency inventories
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false
      - name: Read pinned central inventory helpers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: edithatogo/repository-standards
          ref: a3cc8dccdb67e6f122c71cec713194cdec792d07
          path: target/sbom-policy
          persist-credentials: false
          submodules: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Inventory the exact foundation profile on its maintained Python version
        run: python scripts/generate_sbom.py --component python-foundation --policy-dir target/sbom-policy --output target/sbom/python-foundation
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Inventory native locks and isolated Python profiles
        shell: bash
        run: |
          set -euo pipefail
          for component in rust node api python-legacy python-tests python-assurance python-kernel-baseline python-kernel-candidate; do
            python scripts/generate_sbom.py --component "$component" --policy-dir target/sbom-policy --output "target/sbom/$component"
          done
      - name: Retain BOMs, resolved environments and source receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ github.sha }}
          path: target/sbom/
          if-no-files-found: error
          retention-days: 30
