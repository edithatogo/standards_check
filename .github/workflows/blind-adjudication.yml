name: Blinded model-agent adjudication

on:
  pull_request:
    types: [labeled]
    paths:
      - "scripts/blind_adjudication.py"
      - "tests/test_blind_adjudication.py"
      - ".github/workflows/blind-adjudication.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blind-adjudication-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agent-benchmark:
    # Deliberate experiment authorization after required deterministic checks.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.label.name == 'run-semantic-benchmark')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Test blinding, consensus and gating
        run: python -m unittest tests.test_blind_adjudication -v
      - name: Freeze exact-source pair ledger
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/adjudication-source" "$RUNNER_TEMP/adjudication"
          for id in PMC11995449 PMC11019967; do
            if ! curl --fail --silent --show-error --location --max-redirs 3 \
              --connect-timeout 10 --max-time 45 --max-filesize 8000000 \
              --proto '=https' --proto-redir '=https' \
              "https://www.ebi.ac.uk/europepmc/webservices/rest/$id/fullTextXML" \
              --output "$RUNNER_TEMP/adjudication-source/$id.xml"; then
              rm -f "$RUNNER_TEMP/adjudication-source/$id.xml"
            fi
          done
          python -m scripts.blind_adjudication prepare --root . \
            --source-dir "$RUNNER_TEMP/adjudication-source" --directory "$RUNNER_TEMP/adjudication"
          git rev-parse HEAD > "$RUNNER_TEMP/adjudication/commit.txt"
      - name: Install scoped local inference runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/adjudication-runtime"
          python -m pip download --no-deps --no-binary=:all: --dest "$RUNNER_TEMP/adjudication-runtime" llama-cpp-python==0.3.38
          echo "0570c9736b5e2a239b651da18687238eeba7fc2369dcdfd8cbb009dc1321e23f  $RUNNER_TEMP/adjudication-runtime/llama_cpp_python-0.3.38.tar.gz" | sha256sum --check
          CMAKE_ARGS="-DGGML_NATIVE=OFF" CMAKE_BUILD_PARALLEL_LEVEL=4 python -m pip install "$RUNNER_TEMP/adjudication-runtime/llama_cpp_python-0.3.38.tar.gz"
          python -m pip install onnxruntime==1.23.2 tokenizers==0.22.1
          python -m pip check
          python -m pip freeze > "$RUNNER_TEMP/adjudication/environment.txt"
      - name: Acquire pinned adjudicator weights and existing NLI assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/adjudication-models/nli"
          python - <<'PY'
          import os, subprocess
          from pathlib import Path
          from scripts.blind_adjudication import MODELS, file_hash
          root=Path(os.environ['RUNNER_TEMP'])/'adjudication-models'
          for name,model in MODELS.items():
              url='https://huggingface.co/'+model['id']+'/resolve/'+model['revision']+'/'+model['file']
              path=root/(name+'.gguf')
              subprocess.run(['curl','--fail','--silent','--show-error','--location','--max-redirs','5','--connect-timeout','15','--max-time','600','--max-filesize','1500000000','--proto','=https','--proto-redir','=https',url,'--output',str(path)],check=True)
              if file_hash(path)!=model['sha256']:
                  raise ValueError('adjudicator weight hash mismatch')
          PY
          base="https://huggingface.co/cross-encoder/nli-MiniLM2-L6-H768/resolve/c847a3c0e1cad93a5343183ef183f3044e3fc7c2"
          for name in tokenizer.json config.json onnx/model_quint8_avx2.onnx; do
            curl --fail --silent --show-error --location --max-redirs 5 \
              --connect-timeout 15 --max-time 180 --max-filesize 100000000 \
              --proto '=https' --proto-redir '=https' \
              "$base/$name" --output "$RUNNER_TEMP/adjudication-models/nli/${name##*/}"
          done
      - name: Run isolated blinded model-agent processes
        shell: bash
        run: |
          set -euo pipefail
          for name in qwen smollm; do
            python -m scripts.blind_adjudication judge --directory "$RUNNER_TEMP/adjudication" \
              --model "$name" --weights "$RUNNER_TEMP/adjudication-models/$name.gguf"
          done
      - name: Unblind only after both votes are frozen
        run: |
          python -m scripts.blind_adjudication evaluate --directory "$RUNNER_TEMP/adjudication" \
            --nli-assets "$RUNNER_TEMP/adjudication-models/nli"
      - name: Publish redacted receipts, not source text or weights
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blinded-adjudication-${{ github.sha }}
          path: |
            ${{ runner.temp }}/adjudication/commit.txt
            ${{ runner.temp }}/adjudication/environment.txt
            ${{ runner.temp }}/adjudication/qwen-votes.json
            ${{ runner.temp }}/adjudication/smollm-votes.json
            ${{ runner.temp }}/adjudication/benchmark-receipt.json
          if-no-files-found: warn
          retention-days: 90
