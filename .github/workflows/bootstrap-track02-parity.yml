name: Bootstrap Track 02 contract parity

# bootstrap-attempt: 2
on:
  push:
    branches:
      - feat/diagram-security-accessibility-hardening
    paths:
      - ".github/workflows/bootstrap-track02-parity.yml"

permissions:
  contents: write

concurrency:
  group: bootstrap-track02-parity
  cancel-in-progress: false

jobs:
  parity:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
          submodules: false
      - name: Apply reviewed Rust and schema parity corrections
        run: |
          python .track02-parity/apply.py
          python .track02-parity/fix.py
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.98.1
          components: rustfmt,clippy
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements/standardflow-foundation.txt
      - name: Install exact validation dependency closure
        run: python -m pip install --disable-pip-version-check --no-deps --requirement requirements/standardflow-foundation.txt
      - name: Validate Foundation and bounded artefact contracts
        run: |
          python scripts/validate_foundation.py
          python scripts/validate_artifacts.py
      - name: Format Rust workspace
        run: cargo fmt --all
      - name: Run strict Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Run every Rust target
        run: cargo test --workspace --all-targets --all-features --locked
      - name: Run documentation tests
        run: cargo test --workspace --doc --locked
      - name: Byte-compare all deterministic reference artefacts
        shell: bash
        run: |
          set -euo pipefail
          output_dir="$(mktemp -d)"
          trap 'rm -rf "$output_dir"' EXIT
          for input in contracts/examples/prisma-flow/*.json; do
            stem="$(basename "$input" .json)"
            for format in svg text scene-json; do
              case "$format" in
                svg) extension="svg" ;;
                text) extension="txt" ;;
                scene-json) extension="scene.json" ;;
              esac
              generated="$output_dir/${stem}.${extension}"
              committed="examples/generated/prisma-2020/${stem}.${extension}"
              cargo run --quiet --locked -p standardflow-cli -- \
                diagram prisma "$input" --format "$format" --output "$generated"
              cmp --silent "$committed" "$generated" || {
                echo "Generated drift detected for $committed" >&2
                diff --unified "$committed" "$generated" || true
                exit 1
              }
            done
          done
      - name: Commit verified parity corrections
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .track02-parity
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(diagrams): align Rust recipe validation with schemas"
          git push origin "HEAD:${GITHUB_REF_NAME}"
