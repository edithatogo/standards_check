name: Import reviewed StandardFlow receiving repairs

on:
  push:
    branches: [codex/import-standardflow-20261122]
    paths: [.github/workflows/import-standardflow-once.yml]

permissions:
  contents: read

concurrency:
  group: import-standardflow-once
  cancel-in-progress: false

jobs:
  import-reviewed-repairs:
    if: github.repository == 'edithatogo/standards_check' && github.ref == 'refs/heads/codex/import-standardflow-20261122'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - name: Check out the triggering migration revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          submodules: false
      - name: Preserve and import only the reviewed source revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD:legacy/standardflow)" = e48c081ff946d0fac6a1a4b65a3599c6b7aa3352
          git diff --quiet
          git diff --cached --quiet
          git -c http.https://github.com/.extraheader= fetch --prune --no-tags https://github.com/edithatogo/standardflow.git '+refs/heads/*:refs/remotes/legacy-source/*'
          python3 - <<'PY'
          import json
          from pathlib import Path
          import subprocess

          expected = {
              "refs/heads/main": "af299f724bcf456c131b43a143b3eabc1d81245b",
              "refs/heads/feature/refactor-and-document": "dc51d8e392858d5cb4e653aed199563514191efb",
              "refs/heads/feature/implement-guidelines": "f1680778b4141bb5553b0e80af22bbdf5c75c862",
              "refs/heads/chore/GHA-190519-stepsecurity-remediation": "eb7d0703b86aaa82e3cd738a273db7c60a70f6c9",
              "refs/heads/dependabot/github_actions/actions/setup-python-7.1.0": "7d2e233217d5d3d6c4ca9c5866f64158d117099e",
              "refs/heads/renovate/click-8.x": "3f850b81be3feb1a4d84d003b2ec6c166059a68e",
              "refs/heads/renovate/graphviz-0.x": "38c6327a9fe507150ee2bd655f36269345cf04a8",
              "refs/heads/renovate/ipykernel-6.x": "fb91d00d4f49d9b29e1a1a8dc73b1110b2518e00",
              "refs/heads/renovate/jsonschema-4.x": "59c119a933376d5f2e76d1b0088ad92f14d0fc60",
          }
          manifest = json.loads(Path("conductor/tracks/03-standardflow-import/import.json").read_text())
          if (
              manifest["schema_version"] != "dev.standardflow.legacy-import.v1"
              or manifest["source_refs"] != expected
              or manifest["source_repository"] != "edithatogo/standardflow"
              or manifest["source_commit"] != expected["refs/heads/feature/refactor-and-document"]
              or manifest["source_tree"] != "62d8a0e738f0255cc59822ae4e661568090a213e"
              or manifest["import_prefix"] != "legacy/standardflow"
          ):
              raise SystemExit("The receiving manifest differs from the authorized source snapshot")
          fetched = subprocess.check_output([
              "git", "for-each-ref", "--format=%(refname)%09%(objectname)",
              "refs/remotes/legacy-source/",
          ], text=True)
          fetched_refs = {
              ref.replace("refs/remotes/legacy-source/", "refs/heads/", 1): sha
              for ref, sha in (row.split("\t") for row in fetched.splitlines())
          }
          live = subprocess.check_output([
              "git", "-c", "http.https://github.com/.extraheader=", "ls-remote",
              "--heads", "https://github.com/edithatogo/standardflow.git",
          ], text=True)
          live_refs = {ref: sha for sha, ref in (row.split("\t") for row in live.splitlines())}
          if fetched_refs != expected or live_refs != expected:
              raise SystemExit("Source branch inventory or tips changed; no replacement is authorized")
          print("Verified all nine source heads against the receiving manifest")
          PY
          test "$(git rev-parse dc51d8e392858d5cb4e653aed199563514191efb^1)" = d89a5dbacc207cdce11f19efd667b83fdb09df18
          test "$(git rev-parse dc51d8e392858d5cb4e653aed199563514191efb^{tree})" = 62d8a0e738f0255cc59822ae4e661568090a213e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-ff --no-commit -s ours dc51d8e392858d5cb4e653aed199563514191efb fb91d00d4f49d9b29e1a1a8dc73b1110b2518e00 59c119a933376d5f2e76d1b0088ad92f14d0fc60
          git rm -r --quiet -- legacy/standardflow
          git read-tree --prefix=legacy/standardflow/ -u dc51d8e392858d5cb4e653aed199563514191efb
          import_tree=$(git write-tree)
          test "$(git rev-parse "$import_tree:legacy/standardflow")" = 62d8a0e738f0255cc59822ae4e661568090a213e
          git commit --signoff -m 'fix(migration): import reviewed web and container repairs' -m 'Preserve source dc51d8e and import its exact 62d8a0e tree. No imported code executes in this write-capable job.'
          python3 - <<'PY'
          import subprocess
          changed = subprocess.check_output([
              "git", "diff-tree", "--no-commit-id", "--name-only", "-z", "-r", "HEAD^1", "HEAD",
          ]).split(b"\0")
          if not any(changed) or any(path and not path.startswith(b"legacy/standardflow/") for path in changed):
              raise SystemExit("The import commit changed paths outside the legacy subtree")
          PY
          git merge-base --is-ancestor dc51d8e392858d5cb4e653aed199563514191efb HEAD
          git push origin HEAD:refs/heads/codex/import-standardflow-20261122
