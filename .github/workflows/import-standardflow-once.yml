name: Import legacy StandardFlow history
on:
  push:
    branches: [codex/import-standardflow-20261122]
    paths: [.github/workflows/import-standardflow-once.yml]
permissions:
  contents: read
concurrency:
  group: import-standardflow-once
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: codex/import-standardflow-20261122
      - name: Preserve exact source tree and all source branch histories
        shell: bash
        run: |
          set -euo pipefail
          test ! -e legacy/standardflow
          git -c http.https://github.com/.extraheader= fetch --no-tags https://github.com/edithatogo/standardflow.git '+refs/heads/*:refs/remotes/legacy-source/*'
          test "$(git rev-parse refs/remotes/legacy-source/feature/refactor-and-document)" = d89a5dbacc207cdce11f19efd667b83fdb09df18
          test "$(git rev-parse refs/remotes/legacy-source/main)" = af299f724bcf456c131b43a143b3eabc1d81245b
          test "$(git rev-parse refs/remotes/legacy-source/feature/implement-guidelines)" = f1680778b4141bb5553b0e80af22bbdf5c75c862
          test "$(git rev-parse refs/remotes/legacy-source/chore/GHA-190519-stepsecurity-remediation)" = eb7d0703b86aaa82e3cd738a273db7c60a70f6c9
          test "$(git rev-parse refs/remotes/legacy-source/dependabot/github_actions/actions/setup-python-7.1.0)" = 7d2e233217d5d3d6c4ca9c5866f64158d117099e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-ff --no-commit --allow-unrelated-histories -s ours d89a5dbacc207cdce11f19efd667b83fdb09df18 f1680778b4141bb5553b0e80af22bbdf5c75c862 eb7d0703b86aaa82e3cd738a273db7c60a70f6c9 7d2e233217d5d3d6c4ca9c5866f64158d117099e
          git read-tree --prefix=legacy/standardflow/ -u d89a5dbacc207cdce11f19efd667b83fdb09df18
          import_tree=$(git write-tree)
          test "$(git rev-parse "$import_tree:legacy/standardflow")" = e48c081ff946d0fac6a1a4b65a3599c6b7aa3352
          git commit -s -m 'chore(migration): preserve StandardFlow source history and repaired tree' -m 'Import repaired d89a5db into legacy/standardflow. Additional parents retain all unmerged branch histories without activating their contents. Source tree: e48c081ff946d0fac6a1a4b65a3599c6b7aa3352.'
          git push origin HEAD:refs/heads/codex/import-standardflow-20261122
