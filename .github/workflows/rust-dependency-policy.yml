name: Rust dependency policy
on:
  pull_request:
    paths: ['Cargo.toml', 'Cargo.lock', '**/Cargo.toml', '**/Cargo.lock', 'deny.toml', '.github/workflows/rust-dependency-policy.yml']
  push:
    branches: [main]
    paths: ['Cargo.toml', 'Cargo.lock', '**/Cargo.toml', '**/Cargo.lock', 'deny.toml', '.github/workflows/rust-dependency-policy.yml']
  schedule:
    - cron: '29 4 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dependency-policy:
    uses: edithatogo/repository-standards/.github/workflows/rust-dependency-policy.yml@e1e606f2689ac3e2cf472c01cb207cce367d423d # immutable pilot
    with:
      manifest-path: ./Cargo.toml
      rust-version: stable
