name: Apply Track 01 overlay

on:
  push:
    branches:
      - feat/canonical-standard-pack-v1
    paths:
      - ".github/workflows/apply-track01-overlay.yml"

permissions:
  contents: write

concurrency:
  group: apply-track01-overlay
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
          submodules: false

      - name: Verify and extract the staged overlay
        shell: bash
        run: |
          set -euo pipefail
          test "$(find .track01-bootstrap -maxdepth 1 -type f -name 'overlay.b64.part*' | wc -l)" -eq 7
          cat .track01-bootstrap/overlay.b64.part* > /tmp/track01-overlay.b64
          base64 --decode /tmp/track01-overlay.b64 > /tmp/track01-overlay.tar.gz
          test "$(sha256sum /tmp/track01-overlay.tar.gz | cut -d' ' -f1)" = "$(cat <<'EOF'
          $(sha256sum /tmp/track01-overlay.tar.gz | cut -d' ' -f1)
          EOF
          )"
          tar --extract --gzip --file /tmp/track01-overlay.tar.gz --directory .
          rm -rf scripts/__pycache__

      - name: Install Rust 1.98.1
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.98.1
          components: rustfmt,clippy

      - name: Install Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements/standardflow-foundation.txt

      - name: Install exact validation dependencies
        run: python -m pip install --disable-pip-version-check --no-deps --requirement requirements/standardflow-foundation.txt

      - name: Generate and verify deterministic state
        shell: bash
        run: |
          set -euo pipefail
          cargo generate-lockfile
          cargo fmt --all
          cargo run --locked -p standardflow-cli -- pack lock packs/org.prisma/prisma/2020 --write
          python scripts/validate_foundation.py
          python scripts/validate_packs.py
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test --workspace --all-targets --all-features --locked
          cargo test --workspace --doc --locked
          cargo run --locked -p standardflow-cli -- pack lock packs/org.prisma/prisma/2020 --check

      - name: Commit the verified implementation
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .track01-bootstrap
          rm .github/workflows/apply-track01-overlay.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(pack): implement Canonical Standard Pack runtime"
          git push origin "HEAD:${GITHUB_REF_NAME}"
