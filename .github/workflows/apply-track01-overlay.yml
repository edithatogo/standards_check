name: Apply Track 01 overlay

on:
  push:
    branches:
      - feat/canonical-standard-pack-v1
    paths:
      - ".github/workflows/apply-track01-overlay.yml"

permissions:
  contents: write

concurrency:
  group: apply-track01-overlay
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
          submodules: false

      - name: Verify and extract the staged overlay
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          from pathlib import Path

          expected = {
              "overlay.b64.part00": "158487e66a8c3df16dc2790d58d4ebd837d7c187c79ac4f0d8be546906c502e2",
              "overlay.b64.part01": "3f6f24bed20f40a02fda53e4ecf218db233ce78a3e018a58e6c50993ccee6697",
              "overlay.b64.part02a": "fa75a03f7ed1e3cc94bd9cf69762627edf32ca5471117cc1d40e682aced1a37d",
              "overlay.b64.part02b": "4f3a838f47fdc75b76202cf7fcac430ff0f7cf90338591c4bd8bcadada3241dd",
              "overlay.b64.part03": "6bdb94015466c1ea95163633fb08ccde18b0dea4235cc2b79568c82855283e50",
              "overlay.b64.part04": "78e8e2da2fe412ba66c5a5dff25a15377ad539ffcd6313df3802f90f4b9bb033",
              "overlay.b64.part05": "788e2eff2d6d1b0652210e66ea8718c828526b40ed48c6556f5ec80fa5cbb574",
              "overlay.b64.part06": "8bbbd4190623c75ebd661f9abff293db38bfe723418f26a2204f7828a5100eed",
          }
          root = Path(".track01-bootstrap")
          part_zero = root / "overlay.b64.part00"
          data = part_zero.read_text(encoding="ascii")
          if len(data) == 6999:
              data = data[:1367] + "J" + data[1367:]
              part_zero.write_text(data, encoding="ascii")
          for name, digest in expected.items():
              path = root / name
              observed = hashlib.sha256(path.read_bytes()).hexdigest()
              if observed != digest:
                  raise SystemExit(f"segment integrity failure: {name}: {observed}")
          PY
          cat .track01-bootstrap/overlay.b64.part* > /tmp/track01-overlay.b64
          base64 --decode /tmp/track01-overlay.b64 > /tmp/track01-overlay.tar.gz
          test "$(sha256sum /tmp/track01-overlay.tar.gz | cut -d' ' -f1)" = "baa0c61f32db4699e97df9a29e3a9f5d22a2f4ea8509f8f73557d54e255df315"
          tar --extract --gzip --file /tmp/track01-overlay.tar.gz --directory .
          rm -rf scripts/__pycache__

      - name: Install Rust 1.98.1
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.98.1
          components: rustfmt,clippy

      - name: Install Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements/standardflow-foundation.txt

      - name: Install exact validation dependencies
        run: python -m pip install --disable-pip-version-check --no-deps --requirement requirements/standardflow-foundation.txt

      - name: Generate and verify deterministic state
        shell: bash
        run: |
          set -euo pipefail
          cargo generate-lockfile
          cargo fmt --all
          cargo run --locked -p standardflow-cli -- pack lock packs/org.prisma/prisma/2020 --write
          python scripts/validate_foundation.py
          python scripts/validate_packs.py
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test --workspace --all-targets --all-features --locked
          cargo test --workspace --doc --locked
          cargo run --locked -p standardflow-cli -- pack lock packs/org.prisma/prisma/2020 --check

      - name: Commit the verified implementation
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .track01-bootstrap
          rm .github/workflows/apply-track01-overlay.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(pack): implement Canonical Standard Pack runtime"
          git push origin "HEAD:${GITHUB_REF_NAME}"
