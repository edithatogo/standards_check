name: Bootstrap Track 02 hardening

# bootstrap-attempt: 9
on:
  push:
    branches:
      - feat/diagram-security-accessibility-hardening
    paths:
      - ".github/workflows/bootstrap-track02-hardening.yml"

permissions:
  contents: write

concurrency:
  group: bootstrap-track02-hardening
  cancel-in-progress: false

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
          submodules: false
      - name: Apply reviewed source and contract changes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.track02-hardening/apply.py')
          content = path.read_text(encoding='utf-8')
          replacements = [
              (
                  "    '''//! Shared resource and text-safety limits",
                  "    r'''//! Shared resource and text-safety limits",
              ),
              (
                  "    '''//! Adversarial resource, schema-parity and accessibility regression tests.",
                  "    r'''//! Adversarial resource, schema-parity and accessibility regression tests.",
              ),
          ]
          for old, new in replacements:
              if content.count(old) != 1:
                  raise SystemExit(f'expected exactly one generated Rust literal: {old}')
              content = content.replace(old, new, 1)
          path.write_text(content, encoding='utf-8')
          PY
          python .track02-hardening/apply.py
          python .track02-hardening/fix_apply.py
          rm -rf examples/generated/prisma-2020
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.98.1
          components: rustfmt,clippy
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements/standardflow-foundation.txt
      - name: Install exact validation dependency closure
        run: python -m pip install --disable-pip-version-check --no-deps --requirement requirements/standardflow-foundation.txt
      - name: Validate bounded schemas and source contracts
        run: python scripts/validate_artifacts.py --allow-missing-generated
      - name: Generate dependency lock
        run: cargo generate-lockfile
      - name: Format Rust workspace
        run: cargo fmt --all
      - name: Run strict Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Run every Rust target
        run: cargo test --workspace --all-targets --all-features --locked
      - name: Run documentation tests
        run: cargo test --workspace --doc --locked
      - name: Regenerate all reference artefacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p examples/generated/prisma-2020
          for input in contracts/examples/prisma-flow/*.json; do
            stem="$(basename "$input" .json)"
            cargo run --quiet --locked -p standardflow-cli -- diagram prisma "$input" --format svg --output "examples/generated/prisma-2020/${stem}.svg"
            cargo run --quiet --locked -p standardflow-cli -- diagram prisma "$input" --format text --output "examples/generated/prisma-2020/${stem}.txt"
            cargo run --quiet --locked -p standardflow-cli -- diagram prisma "$input" --format scene-json --output "examples/generated/prisma-2020/${stem}.scene.json"
          done
      - name: Validate generated semantics and accessibility
        run: python scripts/validate_artifacts.py
      - name: Commit verified hardening without workflow mutation
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .track02-hardening
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(diagrams): bound inputs and complete accessible flow semantics"
          git push origin "HEAD:${GITHUB_REF_NAME}"
