name: Assurance

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

concurrency:
  group: assurance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    name: coverage (${{ matrix.component }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: python
            report: python.xml
          - component: rust
            report: rust.lcov
          - component: api
            report: api.lcov
    env:
      CARGO_BUILD_JOBS: "2"
      PROPTEST_CASES: "256"
      PROPTEST_RNG_SEED: "721114987"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      PYTHON_MIN_COVERAGE: "90.5"
      RUST_MIN_LINES: "91"
      API_MIN_LINES: "100"
      API_MIN_BRANCHES: "95"
      PROFILE_BASELINE_REVISION: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: false
      - name: Prepare evidence directory
        run: |
          mkdir -p target/coverage
          git rev-parse HEAD > target/coverage/commit.txt
      - if: matrix.component == 'python'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install Python test and measurement tools
        if: matrix.component == 'python'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends graphviz imagemagick poppler-utils
          python -m pip install --disable-pip-version-check -r requirements/python-tests.txt
          python -m pip install --disable-pip-version-check --no-deps -r requirements/legacy-standardflow.txt
          python -m pip install --disable-pip-version-check --no-deps -r requirements/assurance-tools.txt
          python -m pip check
      - name: Verify the native legacy PNG to TIFF renderer
        if: matrix.component == 'python'
        run: |
          dot -V 2>&1 | tee target/coverage/native-renderers.txt
          convert -version | tee -a target/coverage/native-renderers.txt
          probe_dir="$(mktemp -d)"
          trap 'rm -rf "$probe_dir"' EXIT
          printf '%s\n' 'digraph { first -> second }' | dot -Tpng -o "$probe_dir/diagram.png"
          convert "$probe_dir/diagram.png" "$probe_dir/diagram.tiff"
          test -s "$probe_dir/diagram.tiff"
          test "$(identify -format '%m' "$probe_dir/diagram.tiff")" = TIFF
          printf '%s\n' 'Graphviz PNG to ImageMagick TIFF probe passed' | tee -a target/coverage/native-renderers.txt
      - name: Type check maintained validator and receipt boundaries
        if: matrix.component == 'python'
        run: ty check --python "$(command -v python)" --error-on-warning --output-format github
      - name: Acquire pinned English reference for an explicit NLP qualification change
        if: matrix.component == 'python'
        shell: bash
        run: |
          set -euo pipefail
          # Ordinary unrelated PRs remain model-free. Only NLP changes or explicit dispatch qualify.
          if [ "$GITHUB_EVENT_NAME" != workflow_dispatch ] && git diff --quiet HEAD^1 HEAD -- scripts/classical_linguistic_nlp.py scripts/linguistic_benchmark.py scripts/lexical_text.py requirements/classical-nlp-reference.txt tests/test_classical_linguistic_nlp.py tests/test_linguistic_benchmark.py tests/test_linguistic_role_scope.py; then
            exit 0
          fi
          python -m pip install --disable-pip-version-check -r requirements/classical-nlp-reference.txt
          python -m pip check
          wheel="$RUNNER_TEMP/en_core_web_sm-3.8.0-py3-none-any.whl"
          curl --fail --silent --show-error --location --max-redirs 3 \
            --connect-timeout 10 --max-time 90 --max-filesize 12806118 \
            --proto '=https' --proto-redir '=https' \
            "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" --output "$wheel"
          printf '%s  %s\n' '1932429db727d4bff3deed6b34cfc05df17794f4a52eeb26cf8928f7c1a0fb85' "$wheel" | sha256sum --check
          mkdir -p target/coverage/linguistic
          python -m pip freeze > target/coverage/linguistic/environment.txt

      - name: Prepare the locked CLI for Python's cross-runtime contract
        if: matrix.component == 'python'
        run: |
          toolchain="$(python -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')"
          rustup toolchain install "$toolchain" --profile minimal
      - name: Measure Python regressions and retain native timing
        if: matrix.component == 'python'
        shell: bash
        run: |
          set -euo pipefail
          python -m coverage run -m pytest --import-mode=importlib \
            --durations=20 --durations-min=0.1 \
            --junitxml=target/coverage/python-junit.xml \
            -o junit_logging=no -o junit_log_passing_tests=false \
            tests test_extract_and_convert.py 2>&1 | tee target/coverage/tests.log
          test -s target/coverage/python-junit.xml
      - name: Measure Python validators and cross-runtime evidence
        if: matrix.component == 'python'
        shell: bash
        run: |
          set -euo pipefail
          for validator in validate_foundation validate_packs validate_artifacts validate_costing_reconciliation validate_prisma_source_assurance audit_foundation; do
            python -m coverage run "scripts/${validator}.py"
          done
          profile_args=()
          if [ -n "$PROFILE_BASELINE_REVISION" ] && [ "$PROFILE_BASELINE_REVISION" != 0000000000000000000000000000000000000000 ]; then
            profile_args+=(--baseline-revision "$PROFILE_BASELINE_REVISION")
          fi
          python -m coverage run -m scripts.validate_representation_spec "${profile_args[@]}" \
            --output target/coverage/representation-profile.json
          python -m coverage run -m scripts.validate_publication_contract "${profile_args[@]}" \
            | tee target/coverage/publication-contract.json
          python -m coverage run -m scripts.validate_dataset_release \
            | tee target/coverage/dataset-release.json
          cargo build --locked -p standardflow-cli
          python -m coverage run -m scripts.qualify_legacy_prisma \
            --rust-cli target/debug/standardflow --output target/coverage/legacy-prisma.json
          wheel="$RUNNER_TEMP/en_core_web_sm-3.8.0-py3-none-any.whl"
          if [ -f "$wheel" ]; then
            # Separate processes; timing/RSS include coverage instrumentation.
            python -m coverage run -m scripts.linguistic_benchmark --output target/coverage/linguistic/rules.json
            python -m coverage run -m scripts.linguistic_benchmark --model-wheel "$wheel" --output target/coverage/linguistic/reference.json
            python - <<'PY'
          import json
          from pathlib import Path

          root = Path("target/coverage/linguistic")
          rules = json.loads((root / "rules.json").read_text())
          reference = json.loads((root / "reference.json").read_text())
          assert rules["fixture_sha256"] == reference["fixture_sha256"]
          assert rules["source_pins"] == reference["source_pins"]
          assert rules["metrics"]["cases"] == reference["metrics"]["cases"] == 33
          assert rules["canonical_packs_promoted"] == reference["canonical_packs_promoted"] == 0
          assert reference["method"] == "dependency_assisted"
          assert reference["metrics"]["held"] == 0, "reference failed to parse a benchmark row"
          print("Paired reference challenge executed; no independent semantic qualification implied.")
          PY
          fi
          python -m coverage combine
          python -m coverage xml
          python -m coverage json
          python -m coverage report --fail-under="$PYTHON_MIN_COVERAGE" | tee target/coverage/summary.txt
          # Triage existing local original files only; no external downloads,
          # source-text export, licences, or Canonical Pack promotion.
          python -m scripts.probe_legacy_source_text --output target/coverage/legacy-source-text-triage.json
          # Independent candidate comparison: actual local bytes, no source download in ordinary CI.
          python -m scripts.compare_ecoevo_formats --root . \
            --report target/coverage/legacy-source-text-triage.json \
            --output target/coverage/ecoevo-format-comparison.json
          # Text-free candidate evidence and rights-cleared canonical Parquet; no acquisition.
          python -m scripts.source_reconciliation \
            --ecoevo target/coverage/ecoevo-format-comparison.json \
            --output target/coverage/source-projections --revision "$(git rev-parse HEAD)"

      - name: Benchmark local guideline-family format candidates
        if: matrix.component == 'python'
        run: |
          python -m scripts.compare_guideline_formats --root . \
            --output target/coverage/guideline-format-comparison.json

      - name: Generate and independently read back analytical Parquet snapshot
        if: matrix.component == 'python'
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.project_parquet --output target/coverage/analytical-parquet
          python -m scripts.project_parquet --check --output target/coverage/analytical-parquet

      - name: Compare explicitly selected official EcoEvo download bytes
        if: matrix.component == 'python'
        shell: bash
        run: |
          set -euo pipefail
          # Only changed benchmark code or an explicit workflow dispatch requests source acquisition.
          if [ "$GITHUB_EVENT_NAME" != workflow_dispatch ] && git diff --quiet HEAD^1 HEAD -- scripts/compare_ecoevo_formats.py; then
            exit 0
          fi
          official="$(mktemp -d "$RUNNER_TEMP/ecoevo-official.XXXXXX")"
          trap 'rm -rf -- "$official"' EXIT
          for name in PRISMA-EcoEvo_PDFChecklist.pdf PRISMA-EcoEvo_WordChecklist.docx PRISMA-EcoEvo_ExcelChecklist.xlsx; do
            if ! curl --fail --silent --show-error --location --max-redirs 3 \
              --connect-timeout 10 --max-time 45 --max-filesize 20000000 \
              --proto '=https' --proto-redir '=https' \
              "https://www.prisma-statement.org/s/$name" --output "$official/$name"; then
              rm -f -- "$official/$name"
              echo "::warning::Official EcoEvo source unavailable; leave identity held."
            fi
          done
          python -m scripts.compare_ecoevo_formats --root . --official-dir "$official" \
            --report target/coverage/legacy-source-text-triage.json \
            --output target/coverage/ecoevo-official-byte-comparison.json

      - if: matrix.component == 'rust'
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: "1.100.0"
          components: llvm-tools-preview,rustfmt,clippy
      - name: Install pinned Rust measurement tool
        if: matrix.component == 'rust'
        run: cargo install cargo-llvm-cov --version 0.9.2 --locked
      - name: Measure the Rust workspace
        if: matrix.component == 'rust'
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo llvm-cov --workspace --all-targets --all-features --locked --lcov --output-path target/coverage/rust.lcov --fail-under-lines "$RUST_MIN_LINES" 2>&1 | tee target/coverage/tests.log
          cargo llvm-cov report --json --summary-only --output-path target/coverage/rust-summary.json
      - if: matrix.component == 'api'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Measure the maintained API
        if: matrix.component == 'api'
        run: |
          npm ci --prefix api --ignore-scripts --no-audit --no-fund
          node --test --experimental-test-coverage \
            --test-coverage-include='api/server.js' --test-coverage-include='api/cors-options.js' \
            --test-coverage-lines="$API_MIN_LINES" --test-coverage-branches="$API_MIN_BRANCHES" \
            --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=lcov --test-reporter-destination=target/coverage/api.lcov \
            api/test/*.test.js api/test/security/*.test.cjs
      - name: Bind report bytes to the tested checkout
        env:
          COVERAGE_REPORT: target/coverage/${{ matrix.report }}
          COVERAGE_COMPONENT: ${{ matrix.component }}
        run: |
          test -s "$COVERAGE_REPORT"
          # Native display rounding must not admit a result below the exact floor.
          python3 - <<'PY'
          import json
          import os
          from collections import Counter
          from decimal import Decimal
          from pathlib import Path

          def counts(label, covered, total):
              if type(covered) is not int or type(total) is not int or not 0 <= covered <= total or total == 0:
                  raise SystemExit(f"Invalid or empty {label} coverage counts")
              print(f"{label}: {covered}/{total}")

          def require_floor(label, covered, total, setting):
              counts(label, covered, total)
              floor = Decimal(os.environ[setting])
              if not floor.is_finite() or not 0 < floor <= 100:
                  raise SystemExit(f"Invalid coverage floor: {setting}")
              numerator, denominator = floor.as_integer_ratio()
              if 100 * covered * denominator < numerator * total:
                  raise SystemExit(f"{label} below exact {floor}% floor")

          component = os.environ["COVERAGE_COMPONENT"]
          if component == "python":
              totals = json.loads(Path("target/coverage/python.json").read_text())["totals"]
              counts("Python statements", totals["covered_lines"], totals["num_statements"])
              counts("Python branches", totals["covered_branches"], totals["num_branches"])
              require_floor("Python combined", totals["covered_lines"] + totals["covered_branches"],
                            totals["num_statements"] + totals["num_branches"], "PYTHON_MIN_COVERAGE")
          elif component in ("rust", "api"):
              totals = Counter()
              for line in Path(os.environ["COVERAGE_REPORT"]).read_text().splitlines():
                  key, _, value = line.partition(":")
                  if key in ("LF", "LH", "BRF", "BRH"):
                      count = int(value)
                      if count < 0:
                          raise SystemExit("Negative LCOV coverage count")
                      totals[key] += count
              require_floor(f"{component} lines", totals["LH"], totals["LF"],
                            "RUST_MIN_LINES" if component == "rust" else "API_MIN_LINES")
              if component == "api":
                  require_floor("API branches", totals["BRH"], totals["BRF"], "API_MIN_BRANCHES")
          else:
              raise SystemExit("Unknown coverage component")
          PY
          sha256sum "$COVERAGE_REPORT" > target/coverage/report.sha256
      - name: Retain component coverage evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ matrix.component }}-${{ github.sha }}
          path: target/coverage/
          overwrite: true
          if-no-files-found: error
          retention-days: 30

  cross-platform:
    name: cross-platform (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"
    steps:
      # Audit mode supports GitHub-hosted Linux, macOS and Windows runners.
      - name: Audit runner activity on each supported platform
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.100.0
          components: rustfmt,clippy
      - name: Test all workspace targets and features
        run: cargo test --workspace --all-targets --all-features --locked
      - name: Test workspace documentation examples
        run: cargo test --workspace --doc --all-features --locked
      - name: Check the canonical pack lock through the CLI
        run: cargo run --locked -p standardflow-cli -- pack lock packs/org.prisma/prisma/2020 --check
      - name: Exercise deterministic scene output through the CLI
        run: cargo run --quiet --locked -p standardflow-cli -- diagram prisma contracts/examples/prisma-flow/new-databases-registers.json --format scene-json --output - > /dev/null

  codecov:
    name: codecov (${{ matrix.component }})
    needs: coverage
    if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: python
            report: python.xml
          - component: rust
            report: rust.lcov
          - component: api
            report: api.lcov
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-${{ matrix.component }}-${{ github.sha }}
          path: target/coverage
      - name: Verify the report and tested checkout
        run: |
          test "$(cat target/coverage/commit.txt)" = "$(git rev-parse HEAD)"
          sha256sum --check target/coverage/report.sha256
      - name: Upload one explicit report with OIDC
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          version: v11.3.2
          files: target/coverage/${{ matrix.report }}
          flags: ${{ matrix.component }}
          disable_search: true
          disable_telem: true
          fail_ci_if_error: true

  workflow-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Install pinned code, prose and workflow linters
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-deps -r requirements/assurance-tools.txt
          python -m pip check
          curl --fail --location --silent --show-error --max-time 90 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          curl --fail --location --silent --show-error --max-time 90 \
            --max-redirs 3 --max-filesize 50000000 --proto '=https' --proto-redir '=https' \
            https://github.com/vale-cli/vale/releases/download/v3.28.1/vale_3.28.1_Linux_64-bit.tar.gz \
            --output "$RUNNER_TEMP/vale.tar.gz"
          echo "068954ad869ebec24b8dec6ebcd1cbb1fd5f5a83e966a35baedfae8b2cdc093a  $RUNNER_TEMP/vale.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/vale.tar.gz" -C "$RUNNER_TEMP" vale
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Validate commit hooks and run maintained code and prose checks
        run: |
          pre-commit validate-config
          for hook in eslint ruff ruff-format bandit vale vale-rules; do
            pre-commit run "$hook" --all-files --show-diff-on-failure
          done
      - name: Reconcile Conductor with live GitHub issue links
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/validate_conductor_links.py --live
      - name: Check workflow syntax and offline security policy
        run: |
          "$RUNNER_TEMP/actionlint" -color
          zizmor --offline .github/workflows
      - name: Record Zizmor auditor-persona diagnostics (advisory)
        shell: bash
        run: |
          mkdir -p target/workflow-audit
          zizmor --offline --persona=auditor --format=json-v1 .github/workflows \
            > target/workflow-audit/zizmor-auditor.json || true
          python -m json.tool target/workflow-audit/zizmor-auditor.json >/dev/null
      - name: Retain auditor diagnostics for triage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zizmor-auditor-${{ github.sha }}-${{ github.run_attempt }}
          path: target/workflow-audit/zizmor-auditor.json
          if-no-files-found: error
          retention-days: 14

  boundary-mutations:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Install locked boundary-test dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-deps -r requirements/standardflow-foundation.txt
          python -m pip check
          npm ci --prefix api --ignore-scripts --no-audit --no-fund
      - name: Execute the hand-selected schema and API mutation campaign
        run: python tests/mutation_campaign.py --output target/mutation-evidence/report.json
      - name: Retain each baseline and mutation outcome
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: boundary-mutations-${{ github.sha }}
          path: target/mutation-evidence/
          if-no-files-found: error
          retention-days: 30

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: low
          comment-summary-in-pr: never

  assurance:
    if: always()
    needs: [coverage, cross-platform, workflow-policy, boundary-mutations, dependency-review]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Require each applicable local assurance check
        env:
          COVERAGE: ${{ needs.coverage.result }}
          CROSS_PLATFORM: ${{ needs.cross-platform.result }}
          WORKFLOW_POLICY: ${{ needs.workflow-policy.result }}
          BOUNDARY_MUTATIONS: ${{ needs.boundary-mutations.result }}
          DEPENDENCY_REVIEW: ${{ needs.dependency-review.result }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          test "$COVERAGE" = success
          test "$CROSS_PLATFORM" = success
          test "$WORKFLOW_POLICY" = success
          test "$BOUNDARY_MUTATIONS" = success
          if [ "$EVENT_NAME" = pull_request ]; then
            test "$DEPENDENCY_REVIEW" = success
          else
            test "$DEPENDENCY_REVIEW" = skipped
          fi
