name: Canonical Standard Pack

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "crates/**"
      - "packs/**"
      - "schemas/**"
      - "scripts/validate_packs.py"
      - "conductor/tracks/01-canonical-standard-pack/**"
      - ".github/workflows/standardflow-pack.yml"
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "crates/**"
      - "packs/**"
      - "schemas/**"
      - "scripts/validate_packs.py"
      - "conductor/tracks/01-canonical-standard-pack/**"
      - ".github/workflows/standardflow-pack.yml"

permissions:
  contents: read

concurrency:
  group: standardflow-pack-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements/standardflow-foundation.txt
      - run: python -m pip install --disable-pip-version-check --no-deps --requirement requirements/standardflow-foundation.txt
      - run: python scripts/validate_packs.py

  rust-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.98.1
          components: rustfmt,clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --all-targets --all-features --locked
      - run: cargo test --workspace --doc --locked
      - run: cargo run --locked -p standardflow-cli -- --json pack validate packs/org.prisma/prisma/2020/pack.json
      - run: cargo run --locked -p standardflow-cli -- pack lock packs/org.prisma/prisma/2020 --check

  cross-platform:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.98.1
      - run: cargo test --workspace --all-targets --all-features --locked
      - run: cargo run --locked -p standardflow-cli -- pack lock packs/org.prisma/prisma/2020 --check
