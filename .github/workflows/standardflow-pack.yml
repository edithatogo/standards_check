name: Canonical Standard Pack

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "crates/**"
      - "packs/**"
      - "source/official/**"
      - "contracts/examples/prisma-2020-legacy27*"
      - "schemas/**"
      - "scripts/validate_packs.py"
      - "scripts/validate_prisma_source_assurance.py"
      - "scripts/build_prisma42_candidate.py"
      - "scripts/compare_prisma_source_pdf.py"
      - "scripts/reconcile_authoritative_articles.py"
      - "scripts/review_source_receipts.py"
      - "tests/test_review_source_receipts.py"
      - "scripts/jats_checklist_structure.py"
      - "scripts/legacy_checklist_structure.py"
      - "tests/test_legacy_checklist_structure.py"
      - "tests/test_jats_checklist_structure.py"
      - "tests/test_reconcile_authoritative_articles.py"
      - "tests/test_prisma_source_pdf.py"
      - "tests/test_prisma42_candidate.py"
      - "conductor/source-reconciliation/**"
      - "tests/test_prisma_source_assurance.py"
      - "conductor/tracks/01-canonical-standard-pack/**"
      - ".github/workflows/standardflow-pack.yml"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "crates/**"
      - "packs/**"
      - "source/official/**"
      - "contracts/examples/prisma-2020-legacy27*"
      - "schemas/**"
      - "scripts/validate_packs.py"
      - "scripts/validate_prisma_source_assurance.py"
      - "scripts/build_prisma42_candidate.py"
      - "scripts/compare_prisma_source_pdf.py"
      - "scripts/reconcile_authoritative_articles.py"
      - "scripts/review_source_receipts.py"
      - "tests/test_review_source_receipts.py"
      - "scripts/jats_checklist_structure.py"
      - "scripts/legacy_checklist_structure.py"
      - "tests/test_legacy_checklist_structure.py"
      - "tests/test_jats_checklist_structure.py"
      - "tests/test_reconcile_authoritative_articles.py"
      - "tests/test_prisma_source_pdf.py"
      - "tests/test_prisma42_candidate.py"
      - "conductor/source-reconciliation/**"
      - "tests/test_prisma_source_assurance.py"
      - "conductor/tracks/01-canonical-standard-pack/**"
      - ".github/workflows/standardflow-pack.yml"

permissions:
  contents: read

concurrency:
  group: standardflow-pack-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements/standardflow-foundation.txt
      - run: python -m pip install --disable-pip-version-check --no-deps --requirement requirements/standardflow-foundation.txt
      - run: python scripts/validate_packs.py
      - run: python -m unittest tests.test_prisma_source_assurance
      - run: python scripts/validate_prisma_source_assurance.py
      - run: python -m unittest tests.test_prisma42_candidate
      - run: python scripts/build_prisma42_candidate.py --output /tmp/prisma42-draft.json
      - run: python -m unittest tests.test_prisma_source_pdf

  rust-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.98.1
          components: rustfmt,clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --all-targets --all-features --locked
      - run: cargo test --workspace --doc --locked
      - run: cargo run --locked -p standardflow-cli -- --json pack validate packs/org.prisma/prisma/2020/pack.json
      - run: cargo run --locked -p standardflow-cli -- pack lock packs/org.prisma/prisma/2020 --check

  cross-platform:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.98.1
          components: rustfmt,clippy
      - run: cargo test --workspace --all-targets --all-features --locked
      - run: cargo run --locked -p standardflow-cli -- pack lock packs/org.prisma/prisma/2020 --check

  authoritative-pdf-comparison:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit outbound source retrieval)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify immutable official two-page source
        run: |
          echo '2eedbd5452741f9615307a0bce21a8198c0597ce2a0a8a0fd7e140d64b08c625  source/official/prisma-2020-checklist.pdf' | sha256sum --check
      - name: Install PDF text extraction utility
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends poppler-utils
      - name: Compare every checklist item to the pinned PDF
        run: |
          python -m scripts.compare_prisma_source_pdf \
            --pdf source/official/prisma-2020-checklist.pdf \
            --output "${RUNNER_TEMP}/prisma2020-source-comparison.json"
      - name: Retain structured source evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: prisma2020-source-comparison
          path: ${{ runner.temp }}/prisma2020-source-comparison.json
          if-no-files-found: error
          retention-days: 90


  authoritative-article-tables:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m unittest tests.test_reconcile_authoritative_articles tests.test_jats_checklist_structure tests.test_legacy_checklist_structure -v
      - name: Verify retained table source pins and reconcile offline
        run: |
          python -m scripts.reconcile_authoritative_articles \
            --output "$RUNNER_TEMP/authoritative-article-offline-reconciliation.json" \
            --require-all
      - name: Review retained source evidence and prioritize discrepancies
        run: |
          python -m unittest tests.test_review_source_receipts -v
          python -m scripts.review_source_receipts \
            --receipt "$RUNNER_TEMP/authoritative-article-offline-reconciliation.json" \
            --output "$RUNNER_TEMP/authoritative-article-retrospective.json"
      - name: Determine whether primary-source re-acquisition is needed
        id: source_change
        env:
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ] || \
             ! git rev-parse --verify HEAD^1 >/dev/null 2>&1 || \
             ! git diff --quiet HEAD^1 HEAD -- \
               source/official/authoritative-article-editions.json \
               source/official/authoritative-article-rows.json \
               scripts/reconcile_authoritative_articles.py \
               scripts/jats_checklist_structure.py; then
            echo "live=true" >> "$GITHUB_OUTPUT"
          else
            echo "live=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Acquire only four selected open-access article XML records
        if: steps.source_change.outputs.live == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/authoritative-articles"
          for pmcid in PMC4320440 PMC7839230 PMC8007028 PMC8793177; do
            if ! curl --fail --silent --show-error --retry 2 --connect-timeout 15 \
              --max-time 90 --max-filesize 8000000 --proto '=https' \
              "https://www.ebi.ac.uk/europepmc/webservices/rest/$pmcid/fullTextXML" \
              -o "$RUNNER_TEMP/authoritative-articles/$pmcid.xml"; then
              rm -f "$RUNNER_TEMP/authoritative-articles/$pmcid.xml"
              echo "::warning::Selected source $pmcid could not be acquired; leave it held."
            fi
          done
      - name: Recheck exact primary article bytes and every source row
        if: steps.source_change.outputs.live == 'true'
        run: |
          python -m scripts.reconcile_authoritative_articles \
            --source-dir "$RUNNER_TEMP/authoritative-articles" \
            --output "$RUNNER_TEMP/authoritative-article-reconciliation.json" \
            --require-all
      - name: Retain exact table extracts and per-item source evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: authoritative-article-reconciliation
          path: |
            ${{ runner.temp }}/authoritative-article-offline-reconciliation.json
            ${{ runner.temp }}/authoritative-article-retrospective.json
            ${{ runner.temp }}/authoritative-article-reconciliation.json
          if-no-files-found: error
          retention-days: 90
