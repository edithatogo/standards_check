name: Canonical contract property campaign

on:
  schedule:
    - cron: "23 5 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: canonical-properties-${{ github.ref }}
  cancel-in-progress: false

jobs:
  canonical-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CARGO_BUILD_JOBS: "2"
      PROPTEST_CASES: "256"
      PROPTEST_RNG_SEED: "721114987"
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: "1.98.1"
      - name: Build bounded canonical contract properties
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/property-evidence
          rustc -Vv | tee target/property-evidence/compiler.log
          git rev-parse HEAD | tee target/property-evidence/commit.log
          printf 'PROPTEST_RNG_SEED=%s\nPROPTEST_CASES=%s\n' "$PROPTEST_RNG_SEED" "$PROPTEST_CASES" | tee target/property-evidence/campaign.log
          timeout 540s cargo test --locked -p standardflow-core --test canonical_properties --no-run 2>&1 | tee target/property-evidence/build.log
      - name: Execute canonical and identifier invariants
        shell: bash
        run: |
          set -euo pipefail
          timeout 120s cargo test --locked -p standardflow-core --test canonical_properties -- --test-threads=1 --nocapture 2>&1 | tee target/property-evidence/tests.log
      - name: Preserve execution evidence and regression seeds
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: canonical-properties-rust-1.98.1
          path: |
            target/property-evidence/*.log
            crates/standardflow-core/tests/*.proptest-regressions
          if-no-files-found: warn
          retention-days: 14
