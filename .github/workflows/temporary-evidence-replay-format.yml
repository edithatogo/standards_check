name: Temporary evidence replay formatting diagnostic
on:
  pull_request:
    types: [synchronize]
    paths:
      - ".github/workflows/temporary-evidence-replay-format.yml"
permissions:
  contents: read
jobs:
  format-diagnostic:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.number == 184
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - name: Emit pinned Ruff formatting patch
        run: |
          python -m pip install ruff==0.17.6
          ruff check --fix scripts/evidence_action_replay.py scripts/evidence_deficit_replay.py
          ruff format scripts/evidence_action_replay.py scripts/evidence_deficit_replay.py
          git diff -- scripts/evidence_action_replay.py scripts/evidence_deficit_replay.py
          git hash-object scripts/evidence_action_replay.py scripts/evidence_deficit_replay.py
          ruff check scripts/evidence_action_replay.py scripts/evidence_deficit_replay.py
          ruff format --check scripts/evidence_action_replay.py scripts/evidence_deficit_replay.py
