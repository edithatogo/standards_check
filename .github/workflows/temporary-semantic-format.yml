name: Temporary semantic formatting diagnostic
on:
  pull_request:
    types: [synchronize]
    paths:
      - ".github/workflows/temporary-semantic-format.yml"
permissions:
  contents: read
jobs:
  format-diagnostic:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.number == 155
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - name: Emit exact pinned Ruff formatting patch
        run: |
          python -m pip install ruff==0.17.6
          ruff check --fix scripts/blind_adjudication.py scripts/five_class_benchmark.py scripts/semantic_benchmark.py scripts/witness_adjudication.py
          ruff format scripts/blind_adjudication.py scripts/five_class_benchmark.py scripts/semantic_benchmark.py scripts/witness_adjudication.py
          git diff -- scripts/blind_adjudication.py scripts/five_class_benchmark.py scripts/semantic_benchmark.py scripts/witness_adjudication.py
          ruff check scripts/blind_adjudication.py scripts/five_class_benchmark.py scripts/semantic_benchmark.py scripts/witness_adjudication.py
