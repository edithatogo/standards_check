name: Build Documents

on:
  push:
    branches: [main]
    paths:
      - "markdown/**"
      - "templates/pandoc/**"
      - "scripts/**"
      - "source/**"
      - "reconciliations/**"
      - "pandoc.yaml"
      - "Makefile"
      - ".github/workflows/build-docs.yml"
  pull_request:
    paths:
      - "markdown/**"
      - "templates/pandoc/**"
      - "scripts/**"
      - "source/**"
      - "reconciliations/**"
      - "pandoc.yaml"
      - "Makefile"
      - ".github/workflows/build-docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-documents-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false
      - name: Validate repo
        run: bash scripts/validate_repo.sh

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: validate
    env:
      PAGES_ARTIFACT_NAME: github-pages-${{ github.run_attempt }}
    outputs:
      pages_artifact_name: ${{ env.PAGES_ARTIFACT_NAME }}
      pages_artifact_id: ${{ steps.pages_upload.outputs.artifact_id }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false
      - name: Setup Pandoc
        uses: pandoc/actions/setup@86321b6dd4675f5014c611e05088e10d4939e09e # v1
        with:
          version: "3.9.0.2"
      - name: Install yq for the HTML index
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends yq
      - name: Setup Typst
        uses: typst-community/setup-typst@00ad6338f0b34724ea002136bfb701a6c18585b0 # v5.3.2
        with:
          typst-version: "0.15.1"
      - name: Build documents from a clean generated-output tree
        run: |
          # Retain source Git history, but never publish stale checked-in renderings.
          rm -rf html pdf docx latex
          bash scripts/build_pandoc.sh
      - name: Generate HTML index
        run: bash scripts/generate_html_index.sh
      - name: Check generated HTML accessibility contracts
        run: python3 scripts/verify_site_accessibility.py html
      - name: Verify the site entrypoint
        run: test -s html/index.html
      # Complete the upload before starting the deployment job (actions/deploy-pages#451).
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        id: pages_upload
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: ${{ env.PAGES_ARTIFACT_NAME }}
          path: ./html
      - name: Retain the built HTML for review
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: html-site
          path: html/
          overwrite: true
          if-no-files-found: error
          retention-days: 7
      - name: Upload PDF artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pdf-artifacts
          path: pdf/
          if-no-files-found: error
      - name: Upload LaTeX artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: latex-artifacts
          path: latex/
          if-no-files-found: error
      - name: Upload DOCX artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docx-artifacts
          path: docx/
          if-no-files-found: error

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: build
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    env:
      # A failed-job rerun must reuse the successful producer's attempt and artifact.
      PAGES_ARTIFACT_NAME: ${{ needs.build.outputs.pages_artifact_name }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Wait for the uploaded Pages artifact metadata
        timeout-minutes: 2
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PAGES_ARTIFACT_ID: ${{ needs.build.outputs.pages_artifact_id }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import time
          from urllib.parse import quote
          from urllib.request import Request, urlopen

          artifact_id = int(os.environ["PAGES_ARTIFACT_ID"])
          run_id = int(os.environ["GITHUB_RUN_ID"])
          name = os.environ["PAGES_ARTIFACT_NAME"]
          url = (
              f"{os.environ['GITHUB_API_URL']}/repos/{os.environ['GITHUB_REPOSITORY']}"
              f"/actions/runs/{run_id}/artifacts?name={quote(name, safe='')}&per_page=100"
          )
          request = Request(url, headers={
              "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          })
          deadline = time.monotonic() + 60
          while True:
              remaining = deadline - time.monotonic()
              if remaining <= 0:
                  raise SystemExit(f"Timed out waiting for Pages artifact {artifact_id} ({name})")
              with urlopen(request, timeout=min(10, remaining)) as response:
                  payload = json.load(response)
              artifacts = payload["artifacts"]
              if payload["total_count"] != len(artifacts):
                  raise SystemExit("Artifact metadata is incomplete; refusing an ambiguous deployment")
              matches = [artifact for artifact in artifacts if artifact["name"] == name]
              if len(matches) > 1:
                  raise SystemExit(f"Multiple artifacts match the current Pages attempt: {name}")
              if matches:
                  artifact = matches[0]
                  if (artifact["id"] != artifact_id or artifact["expired"] is not False
                          or artifact["workflow_run"]["id"] != run_id):
                      raise SystemExit("Pages artifact ID, run or expiry does not match this upload")
                  print(f"Pages artifact {artifact_id} ({name}) is visible for run {run_id}")
                  break
              time.sleep(min(2, max(0, deadline - time.monotonic())))
          PY
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          artifact_name: ${{ env.PAGES_ARTIFACT_NAME }}
