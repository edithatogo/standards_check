name: Native format development qualification

on:
  pull_request:
    paths:
      - 'experiments/native-format-qualification/**'
      - '.github/workflows/native-format-qualification.yml'
      - 'deny.toml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-format-qualification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
    defaults:
      run:
        shell: bash --noprofile --norc -euo pipefail {0}
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: "1.100.0"
      - name: Resolve candidate graph without compiling
        run: |
          mkdir -p target/native-format-evidence
          git rev-parse HEAD > target/native-format-evidence/commit.txt
          rustc -Vv > target/native-format-evidence/compiler.txt
          cargo -V > target/native-format-evidence/cargo.txt
          cp experiments/native-format-qualification/Cargo.toml.candidate \
            experiments/native-format-qualification/Cargo.toml
          cargo generate-lockfile --manifest-path experiments/native-format-qualification/Cargo.toml
          cp experiments/native-format-qualification/Cargo.lock target/native-format-evidence/Cargo.lock
          python3 - <<'PY'
          import hashlib
          import json
          import re
          import tomllib
          from pathlib import Path

          root = Path("experiments/native-format-qualification")
          manifest = tomllib.loads((root / "Cargo.toml").read_text())
          lock = (root / "Cargo.lock").read_bytes()
          packages = tomllib.loads(lock.decode())["package"]
          local = [row for row in packages if "source" not in row]
          if len(local) != 1 or local[0]["name"] != manifest["package"]["name"]:
              raise SystemExit("unexpected local package")
          registry = [row for row in packages if "source" in row]
          for row in registry:
              if row["source"] != "registry+https://github.com/rust-lang/crates.io-index":
                  raise SystemExit("unexpected package source")
              if not re.fullmatch(r"[0-9a-f]{64}", row.get("checksum", "")):
                  raise SystemExit("missing registry checksum")
          for name, pin in manifest["dependencies"].items():
              if not pin.startswith("=") or not any(
                  row["name"] == name and row["version"] == pin[1:] for row in registry
              ):
                  raise SystemExit("direct pin not resolved")
          receipt = {
              "status": "resolved_not_admitted",
              "lock_sha256": hashlib.sha256(lock).hexdigest(),
              "registry_packages": len(registry),
              "direct_pins": manifest["dependencies"],
              "scope": "isolated synthetic development probe",
          }
          Path("target/native-format-evidence/resolution.json").write_text(
              json.dumps(receipt, sort_keys=True, indent=2) + "\n"
          )
          print(json.dumps(receipt, sort_keys=True))
          PY
          sha256sum target/native-format-evidence/Cargo.lock \
            > target/native-format-evidence/lock.sha256
      - name: Check candidate dependency policy before build
        uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2.1.3
        with:
          manifest-path: ./experiments/native-format-qualification/Cargo.toml
          rust-version: "1.100.0"
          command: check
          arguments: "--all-features --locked"
          command-arguments: "--config deny.toml"
      - name: Fetch exact checked graph and run bounded synthetic probe offline
        run: |
          cmp experiments/native-format-qualification/Cargo.lock target/native-format-evidence/Cargo.lock
          cargo fetch --locked --manifest-path experiments/native-format-qualification/Cargo.toml
          cargo metadata --locked --offline --format-version 1 \
            --manifest-path experiments/native-format-qualification/Cargo.toml \
            > target/native-format-evidence/metadata.json
          CARGO_NET_OFFLINE=true cargo test --locked --offline \
            --manifest-path experiments/native-format-qualification/Cargo.toml \
            2>&1 | tee target/native-format-evidence/tests.log
          cmp experiments/native-format-qualification/Cargo.lock target/native-format-evidence/Cargo.lock
          git diff --exit-code -- Cargo.lock deny.toml
      - name: Retain candidate lock, graph and qualification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-format-development-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/native-format-evidence/
          if-no-files-found: error
          retention-days: 30
