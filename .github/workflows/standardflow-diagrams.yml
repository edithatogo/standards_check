name: StandardFlow diagrams

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "requirements/standardflow-foundation.txt"
      - "crates/standardflow-artifacts/**"
      - "crates/standardflow-cli/**"
      - "contracts/examples/prisma-flow/**"
      - "recipes/prisma-2020/**"
      - "schemas/artifact-recipe.v1.schema.json"
      - "schemas/prisma-flow.v1.schema.json"
      - "schemas/scene-graph.v1.schema.json"
      - "examples/generated/prisma-2020/**"
      - "scripts/validate_artifacts.py"
      - "conductor/tracks/02-semantic-diagram-prisma/**"
      - ".github/workflows/bootstrap-track02-generated.yml"
      - ".github/workflows/standardflow-diagrams.yml"
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "requirements/standardflow-foundation.txt"
      - "crates/standardflow-artifacts/**"
      - "crates/standardflow-cli/**"
      - "contracts/examples/prisma-flow/**"
      - "recipes/prisma-2020/**"
      - "schemas/artifact-recipe.v1.schema.json"
      - "schemas/prisma-flow.v1.schema.json"
      - "schemas/scene-graph.v1.schema.json"
      - "examples/generated/prisma-2020/**"
      - "scripts/validate_artifacts.py"
      - "conductor/tracks/02-semantic-diagram-prisma/**"
      - ".github/workflows/standardflow-diagrams.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: standardflow-diagrams-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  contracts-and-accessibility:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements/standardflow-foundation.txt
      - name: Install exact validation dependency closure
        run: python -m pip install --disable-pip-version-check --no-deps --requirement requirements/standardflow-foundation.txt
      - name: Validate schemas, recipes, inputs, SVG semantics and text equivalents
        run: python scripts/validate_artifacts.py

  rust-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.98.1
          components: rustfmt,clippy
      - name: Fetch the exact locked dependency graph
        run: cargo fetch --locked
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run strict Clippy offline
        env:
          CARGO_NET_OFFLINE: "true"
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Run every Rust target offline
        env:
          CARGO_NET_OFFLINE: "true"
        run: cargo test --workspace --all-targets --all-features --locked
      - name: Run documentation tests offline
        env:
          CARGO_NET_OFFLINE: "true"
        run: cargo test --workspace --doc --locked

  deterministic-generation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.98.1
      - name: Fetch the exact locked dependency graph
        run: cargo fetch --locked
      - name: Regenerate and byte-compare all twelve reference artefacts
        env:
          CARGO_NET_OFFLINE: "true"
        shell: bash
        run: |
          set -euo pipefail
          output_dir="$(mktemp -d)"
          trap 'rm -rf "$output_dir"' EXIT
          for input in contracts/examples/prisma-flow/*.json; do
            stem="$(basename "$input" .json)"
            for format in svg text scene-json; do
              case "$format" in
                svg) extension="svg" ;;
                text) extension="txt" ;;
                scene-json) extension="scene.json" ;;
              esac
              generated="$output_dir/${stem}.${extension}"
              committed="examples/generated/prisma-2020/${stem}.${extension}"
              cargo run --quiet --locked -p standardflow-cli -- \
                diagram prisma "$input" --format "$format" --output "$generated"
              cmp --silent "$committed" "$generated" || {
                echo "Generated drift detected for $committed" >&2
                diff --unified "$committed" "$generated" || true
                exit 1
              }
            done
          done
      - name: Confirm generation left the repository unchanged
        run: git diff --exit-code

  cross-platform:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.98.1
      - name: Run all tests
        run: cargo test --workspace --all-targets --all-features --locked
      - name: Exercise deterministic scene output
        shell: bash
        run: cargo run --quiet --locked -p standardflow-cli -- diagram prisma contracts/examples/prisma-flow/new-databases-registers.json --format scene-json > /dev/null
