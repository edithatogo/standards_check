name: Repository health

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "47 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-health-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  alint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false
      - uses: asamarts/alint@465e70c48ec13774c8cb3bb58856b58b71e3a93d # v0.23.0
        with:
          config: .alint.yml

  repohealth:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: false
      - name: Report repository health (advisory, no threshold)
        shell: bash
        env:
          REPOHEALTH_VERSION: "0.5.3"
          REPOHEALTH_SHA256: "68a2fee769ae8f3652d503d07508a91ec1cf73c8463b6846d030762f6d2459d2"
        run: |
          set -euo pipefail
          tool_dir="$(mktemp -d "$RUNNER_TEMP/repohealth.XXXXXXXX")"
          archive="$tool_dir/repohealth.tar.gz"
          curl --fail --silent --show-error --location --retry 3 --max-time 90 \
            "https://github.com/spbuilds/repohealth/releases/download/v${REPOHEALTH_VERSION}/repohealth_${REPOHEALTH_VERSION}_linux_amd64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$REPOHEALTH_SHA256" "$archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$tool_dir" repohealth
          "$tool_dir/repohealth" . --format markdown | tee -a "$GITHUB_STEP_SUMMARY"
